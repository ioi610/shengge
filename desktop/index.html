<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; frame-src 'none'"><title>声格</title><link rel="stylesheet" href="desktop.css"><script src="shell.js" defer></script></head><body>
<header><button id="home" aria-label="回到视频首页"><img src="brand.svg" alt="">声格</button><span class="tab">视频</span><button id="records">学习记录</button><span id="source"></span><button id="add" aria-label="导入视频链接" title="导入视频链接"><img src="icons/plus.svg" alt=""></button></header>
<main id="landing"><form id="import"><img src="icons/link-2.svg" alt=""><input id="url" aria-label="视频链接" placeholder="粘贴视频链接" autocomplete="off" spellcheck="false"><button type="button" id="paste" title="粘贴链接" aria-label="粘贴链接"><img src="icons/clipboard.svg" alt=""></button><button class="accent" title="打开视频" aria-label="打开视频"><img src="icons/arrow-right.svg" alt=""></button></form><small>bilibili · YouTube</small><section><h2>继续学习</h2><div id="cards"></div></section></main>
<main id="study" hidden><div class="col"><div id="screen"></div><div id="caption" aria-live="polite"></div><div class="timeline"><progress id="progress" max="1" value="0"></progress><div><span id="position"></span><span id="duration"></span></div></div><div class="bar"><button id="play" title="播放或暂停" aria-label="播放或暂停"><img src="icons/play.svg" alt=""></button><button id="practice" class="primary" title="按句复读、跟读、自动识别"><img src="icons/audio-lines.svg" alt="">边播边练</button><button id="start"><img src="icons/message-circle.svg" alt="">接话</button><button id="site">原站控件</button><button id="sub" title="导入 SRT 或 VTT 字幕" aria-label="导入字幕"><img src="icons/captions.svg" alt=""></button></div><div id="actions"></div></div><aside><h2>接话 <span id="count"></span></h2><ol id="rows"></ol></aside></main><div role="status" id="notice" aria-live="polite"></div></body></html>
